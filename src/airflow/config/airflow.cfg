[core]
# The home folder for airflow, default is ~/airflow
airflow_home = /opt/airflow

# The folder where your airflow DAGs are stored
dags_folder = /opt/airflow/dags

# The base url of your website as airflow cannot guess what domain or
# cname you are using. This is used in automated emails that
# airflow sends to alert you when a task fails
base_url = http://localhost:8080

# Default owner used for new DAGs
default_owner = airflow

# Default timezone to display all dates in the UI, can be UTC, system, or
# any IANA timezone string (e.g. Europe/Amsterdam)
default_timezone = utc

# The executor class that airflow should use. Choices include
# SequentialExecutor, LocalExecutor, CeleryExecutor, DaskExecutor, KubernetesExecutor, CeleryKubernetesExecutor
executor = CeleryExecutor

# The SqlAlchemy connection string to the metadata database.
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres/airflow

# Whether to disable pickling dags
donot_pickle = True

# How long before timing out a python file import
dagbag_import_timeout = 30.0

# Whether to pause DAGs when first imported
dags_are_paused_at_creation = True

# Whether to load the DAG examples that ship with Airflow
load_examples = False

[logging]
# The base log folder
base_log_folder = /opt/airflow/logs

# Airflow can store logs remotely in AWS S3, Google Cloud Storage or Elastic Search.
remote_logging = False

# Logging level
logging_level = INFO

[webserver]
# The base url of your website as airflow cannot guess what domain or
# cname you are using. This is used in automated emails that
# airflow sends to alert you when a task fails
base_url = http://localhost:8080

# The ip specified when starting the web server
web_server_host = 0.0.0.0

# The port on which to run the web server
web_server_port = 8080

# Number of seconds the webserver waits before killing gunicorn master
web_server_master_timeout = 120

# Number of seconds the gunicorn webserver waits before timing out on a worker
web_server_worker_timeout = 120

# Number of workers to refresh at a time. When set to 0, worker refresh is
# disabled. When nonzero, airflow periodically refreshes webserver workers by
# bringing up new ones and killing old ones.
worker_refresh_batch_size = 1

# Number of seconds to wait before refreshing a batch of workers.
worker_refresh_interval = 30

# Secret key used to run your flask app
secret_key = ed88dc19fb6f1a1228d8d8311ddeca64449e1eacb3921bafd931a7a2fcb9dc13

# Whether to enable authentication
authenticate = True

# Expose the configuration file in the web server
expose_config = True

# Set to true to turn on authentication
auth_backend = airflow.api.auth.backend.basic_auth

[api]
# Enables the deprecated experimental API. Please note that these APIs do not have access control.
enable_experimental_api = False

# How to authenticate users of the API. See
# https://airflow.apache.org/docs/apache-airflow/stable/security/api.html for possible values.
auth_backends = airflow.api.auth.backend.basic_auth

[api_auth]
# JWT Authentication settings
jwt_secret = ed88dc19fb6f1a1228d8d8311ddeca64449e1eacb3921bafd931a7a2fcb9dc13
jwt_header_name = Authorization
jwt_header_type = Bearer
jwt_algorithm = HS256

[celery]
# The app name that will be used by celery
celery_app_name = airflow.executors.celery_executor

# The concurrency that will be used when starting workers with the
# "airflow celery worker" command. This defines the number of task instances that
# a worker will take, so size the value based on the resources on
# your worker box and the nature of your tasks
worker_concurrency = 16

# The Celery broker URL. Celery supports RabbitMQ, Redis and experimentally
# a sqlalchemy database. Refer to the Celery documentation for more information.
broker_url = redis://:@redis:6379/0

# The Celery result_backend. When a job finishes, it needs to update the
# metadata of the job. Therefore it will post a message on a message bus,
# or insert it into a database (depending of the backend)
result_backend = db+postgresql://airflow:airflow@postgres/airflow

# Celery Flower is a sweet web-based tool for monitoring and administrating
# Celery clusters. Airflow has a shortcut to start it `airflow celery flower`.
flower_host = 0.0.0.0

# The root URL for Flower
flower_url_prefix =

# This defines the maximum number of tasks that a worker can execute simultaneously
flower_port = 5555

[operators]
# The default owner assigned to each new operator, unless provided explicitly or passed via `default_args`
default_owner = airflow

[scheduler]
# Task instances listen for external kill signal (when you `airflow tasks kill`),
# this defines the frequency at which they should listen (in seconds).
job_heartbeat_sec = 5

# The number of seconds to wait between consecutive scheduler loops
scheduler_heartbeat_sec = 5

# After how much time (in seconds) a new DAGs should be picked up from the filesystem
min_file_process_interval = 0

# How often (in seconds) to scan the DAGs directory for new files. Default to 5 minutes.
dag_dir_list_interval = 300

# How often should stats be printed to the logs. Setting to 0 will disable printing stats
print_stats_interval = 30

# Whether to catch up by default
catchup_by_default = False

[smtp]
# If you want airflow to send emails on retries, failure, and you want to use
# the airflow.utils.email.send_email_smtp function, you have to configure an
# smtp server here
smtp_host = localhost
smtp_starttls = True
smtp_ssl = False
# Example: smtp_user = airflow
# smtp_user =
# Example: smtp_password = airflow
# smtp_password =
smtp_port = 587
smtp_mail_from = admin@lapgenie.com
